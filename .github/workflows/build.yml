name: Build ed Auto-Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag per la release'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          pip install pyinstaller customtkinter
          
      - name: Compila eseguibile
        run: pyinstaller --clean --onefile --windowed animeunity_exporter.py
        
      - name: Pubblica su GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/animeunity_exporter*
          generate_release_notes: true
          draft: false
          prerelease: false
